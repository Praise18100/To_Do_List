<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To Do List</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>To Do List</h1>
      <p>Task</p>
    </div>

    <div class="input-row">
      <input type="text" id="new-task-input" placeholder="What needs to be done?" maxlength="120"/>
      <button class="btn btn-primary" id="add-task-btn">Add Task</button>
    </div>

    <div class="list-header">
      <h2>Tasks</h2>
      <button class="btn btn-clear" id="clear-all-btn">Clear All</button>
    </div>

    <ul id="task-list"></ul>

    <div class="footer">Press Enter to add a task &nbsp;·&nbsp; Check to complete &nbsp;·&nbsp; 🗑 to remove</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
